<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - BelanjaYuk</title>
    <link rel="icon" href="https://i.imgur.com/WRVAelJ.png">
    <style>
        body { 
            font-family: 'Segoe UI'; 
            background: #0a0a0a; 
            color: white; 
            margin: 0; 
            padding-bottom: 80px; /* Ruang buat bottom nav */
        }
        /* HEADER + SEARCH */
        header { 
            background: #111; 
            padding: 15px 20px 10px 20px; 
            position: sticky;
            top: 0;
            z-index: 99;
            border-bottom: 1px solid #00ff88;
        }
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #222;
            border-radius: 10px;
            padding: 10px 15px;
            border: 1px solid #333;
        }
        .search-bar input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 14px;
        }

        /* KATEGORI YANG DICARI - PINDAH KE SINI */
        .recent-categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-top: 12px;
            padding-bottom: 5px;
        }
        .recent-categories::-webkit-scrollbar { display: none; } /* Sembunyiin scroll */
        .cat-item {
            background: #1a1a1a;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-item:hover { background: #00ff88; color: #000; }

        /* KONTEN */
        .container { padding: 20px; }
        h3 { color: #00ff88; margin-bottom: 15px; }

        /* GRID PRODUK RANDOM */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .product-card {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: 0.2s;
        }
        .product-card:hover { border-color: #00ff88; transform: translateY(-3px); }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #222;
        }
        .product-info { padding: 10px; }
        .product-info h4 { margin: 0; font-size: 14px; height: 40px; overflow: hidden; }
        .product-info .price { color: #00ff88; font-weight: bold; margin: 5px 0; }
        .product-info .store { font-size: 12px; color: #777; }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
        }
        .nav-item {
            text-align: center;
            color: #777;
            font-size: 11px;
            cursor: pointer;
        }
        .nav-item.active { color: #00ff88; }
        .nav-item .icon { font-size: 22px; display: block; }
    </style>
</head>
<body>
    <header>
        <div class="search-bar">
            🔍 <input type="text" id="searchInput" placeholder="Cari di BelanjaYuk" onkeyup="searchCategory(event)">
        </div>
        
        <!-- INI UDAH PINDAH KE BAWAH SEARCH -->
        <div class="recent-categories" id="recentCat">
            <!-- Isi otomatis dari JS -->
        </div>
    </header>

    <main class="container">
        <h3>Rekomendasi Untukmu</h3>
        <div class="product-grid" id="productGrid">
            <!-- Produk random akan muncul di sini -->
        </div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active"><span class="icon">🏠</span>Dashboard</div>
        <div class="nav-item"><span class="icon">🎁</span>Promo</div>
        <div class="nav-item"><span class="icon">🔴</span>Live</div>
        <div class="nav-item"><span class="icon">🔔</span>Notifikasi</div>
        <div class="nav-item" onclick="window.location.href='akun.html'"><span class="icon">👤</span>Akun</div>
    </nav>

    <script>
        // CEK LOGIN
        if(localStorage.getItem('isLogin') !== 'true') {
            window.location.href = 'index.html';
        }

        // DATA PRODUK RANDOM DUMMY
        const dummyProducts = [
            {nama: "Sepatu Nike Air Max 90", harga: "Rp 850.000", toko: "Sneakers Store", img: "https://via.placeholder.com/300x300/222/00ff88?text=Sepatu"},
            {nama: "iPhone 15 Pro Max 256GB", harga: "Rp 22.500.000", toko: "Gadget Official", img: "https://via.placeholder.com/300x300/222/00ff88?text=HP"},
            {nama: "Kaos Oversize Hitam Premium", harga: "Rp 120.000", toko: "Distro Keren", img: "https://via.placeholder.com/300x300/222/00ff88?text=Baju"},
            {nama: "Smartwatch GT4 AMOLED", harga: "Rp 1.500.000", toko: "Tech Gadget", img: "https://via.placeholder.com/300x300/222/00ff88?text=Jam"},
            {nama: "Tas Ransel Eiger 30L", harga: "Rp 450.000", toko: "Outdoor Gear", img: "https://via.placeholder.com/300x300/222/00ff88?text=Tas"},
            {nama: "Lipstik Matte Wardah", harga: "Rp 35.000", toko: "Beauty Shop", img: "https://via.placeholder.com/300x300/222/00ff88?text=Cosmetic"}
        ];

        // TAMPILKAN PRODUK RANDOM
        function loadProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            dummyProducts.sort(() => 0.5 - Math.random());
            dummyProducts.forEach(p => {
                grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.nama}">
                    <div class="product-info">
                        <h4>${p.nama}</h4>
                        <div class="price">${p.harga}</div>
                        <div class="store">${p.toko}</div>
                    </div>
                </div>
                `;
            });
        }

        // SIMPAN KATEGORI YANG DICARI
        function searchCategory(event) {
            if(event.key === 'Enter') {
                const keyword = document.getElementById('searchInput').value.trim();
                if(keyword.length > 1) {
                    let recent = JSON.parse(localStorage.getItem('recentCategories')) || [];
                    // hapus duplikat dulu
                    recent = recent.filter(item => item.toLowerCase() !== keyword.toLowerCase());
                    recent.unshift(keyword);
                    if(recent.length > 6) recent.pop(); // max 6
                    localStorage.setItem('recentCategories', JSON.stringify(recent));
                    loadRecentCategories();
                    document.getElementById('searchInput').value = ''; // kosongin search
                }
            }
        }

        function loadRecentCategories() {
            let recent = JSON.parse(localStorage.getItem('recentCategories')) || [];
            const container = document.getElementById('recentCat');
            container.innerHTML = '';
            if(recent.length === 0) {
                container.innerHTML = `<div style="color:#555; font-size:12px;">Belum ada riwayat pencarian</div>`;
            } else {
                recent.forEach(cat => {
                    container.innerHTML += `<div class="cat-item" onclick="document.getElementById('searchInput').value='${cat}'">${cat}</div>`;
                });
            }
        }

        window.onload = () => {
            loadProducts();
            loadRecentCategories();
        }
    </script>
</body>
      </html>
