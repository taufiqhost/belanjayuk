<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BelanjaYuk</title>
    <link rel="icon" href="https://i.imgur.com/WRVAelJ.png">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0;}
        html, body {
            height: 100%; overflow: hidden;
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0a0a0a, #0d3b1e); 
            color: white;
        }
        body {display: flex; justify-content: center; align-items: center;}
        header {
            background: #00ff88; color: #000; display: flex; gap: 8px; 
            padding: 10px 20px; border-radius: 12px; position: absolute; 
            top: 20px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 4px 15px rgba(0,255,136,0.4); font-weight: bold; z-index: 10;
        }
       .card-3d {
            background: #111; padding: 25px; border-radius: 16px; 
            width: 90%; max-width: 450px; max-height: 90vh;
            box-shadow: 0 10px 40px rgba(0,255,136,0.2);
            overflow-y: auto;
        }
        .card-title {text-align: center; margin-bottom: 20px;}
        .card-title h2 { color: #00ff88; font-size: 20px;}
       .form-group {margin-bottom: 15px;}
        label { display: block; margin-bottom: 6px; color: #ccc; font-size:14px; font-weight: 500;}
        input, select, textarea {
            width: 100%; padding: 12px; border: 1.5px solid #333; 
            border-radius: 10px; background: #1a1a1a; color: white; font-size: 15px;
        }
        input:focus, select:focus { border-color: #00ff88; outline: none; background: #222;}
        button {
            width: 100%; padding: 14px; background: #00ff88; border: none; 
            border-radius: 10px; color: #000; font-weight: bold; font-size: 16px; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,136,0.3); margin-top: 10px;
        }
        button:disabled {background: #444; color: #888; cursor: not-allowed;}
       .checkbox-wrap {display: flex; align-items: center; gap: 10px; margin: 18px 0; font-size: 13px;}
       .checkbox-wrap input[type="checkbox"] {width: 18px; height: 18px; accent-color: #00ff88; cursor: pointer;}
       .checkbox-wrap a {color:#00ff88; font-weight: bold; text-decoration: none; border-bottom: 1px solid #00ff88;}
       .hidden { display: none; }
       .error-popup {background: #ff0044; color: white; padding: 10px; border-radius: 8px; text-align: center; margin-top: 15px; display: none;}
       .success-popup {background: #00ff88; color: #000; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; display: none;}
       .timer {text-align: center; color: #aaa; margin-top: 10px; font-size: 13px;}
       .link-bottom {text-align:center; margin-top:15px; font-size:14px; color: #aaa;}
       .link-bottom a {color:#00ff88; font-weight: bold; cursor: pointer;}
       .app-version {position: fixed; bottom: 8px; left: 10px; font-size: 10px; color: #00ff88; z-index: 99;}
       .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none;
            justify-content: center; align-items: center;
            z-index: 100; backdrop-filter: blur(5px);
        }
       .popup-box {
            background: #111; border: 2px solid #00ff88; padding: 25px; border-radius: 16px;
            text-align: center; width: 85%; max-width: 350px; box-shadow: 0 0 30px rgba(0,255,136,0.5);
        }
       .popup-box h3 {color: #00ff88; margin-bottom: 10px; font-size: 18px;}
       .popup-box p {color: #ccc; font-size: 14px; margin-bottom: 15px;}
       .popup-box button {width: auto; padding: 10px 25px; margin-top: 0;}
    </style>
</head>
<body>
    <header>🛒 BelanjaYuk</header>
    <div class="app-version">v1.0.0</div>

    <div id="popup" class="popup-overlay">
        <div class="popup-box">
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>

    <div class="card-3d">
        <div id="loginTab">
            <div class="card-title"><h2>Selamat Datang</h2></div>
            <form onsubmit="login(event)">
                <div class="form-group"><label>No Telpon/Gmail</label><input type="text" id="loginUser" placeholder="08xxx / nama@gmail.com" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="Masukkan password" required></div>
                <div id="errorMsg" class="error-popup">No Telpon/Gmail atau Password salah</div>
                <button type="submit">MASUK</button>
            </form>
            <div class="link-bottom">Belum punya akun? <a onclick="showTab('registerTab')">Daftar</a></div>
        </div>

        <div id="registerTab" class="hidden">
            <div class="card-title"><h2>Buat Akun Baru</h2></div>
            <form onsubmit="registerStep1(event)">
                <div class="form-group"><label>Nama Lengkap</label><input type="text" id="regNama" required></div>
                <div class="form-group"><label>No Telpon</label><input type="text" id="regHp" placeholder="08xxxxxxxxxx" required></div>
                <div class="form-group"><label>Gmail</label><input type="email" id="regEmail" placeholder="nama@gmail.com" required></div>
                <div class="form-group"><label>Provinsi</label><select id="regProvinsi" onchange="loadKabupaten()" required><option value="">Pilih Provinsi</option></select></div>
                <div class="form-group"><label>Kabupaten</label><select id="regKabupaten" onchange="loadKecamatan()" required><option value="">Pilih Provinsi Dulu</option></select></div>
                <div class="form-group"><label>Kecamatan</label><select id="regKecamatan" required><option value="">Pilih Kabupaten Dulu</option></select></div>
                <div class="form-group"><label>Alamat</label><textarea id="regAlamat" placeholder="cth: Jln Sudirman Rt 01 Rw 01 gang melati, rumah warna hijau" rows="2" required></textarea></div>
                <div class="checkbox-wrap"><input type="checkbox" id="agreeTnC" required><label for="agreeTnC">Saya setuju dengan <a onclick="alert('Syarat & Ketentuan BelanjaYuk')">Syarat & Ketentuan</a></label></div>
                <button type="submit">KIRIM OTP</button>
            </form>
            <div class="link-bottom">Sudah punya akun? <a onclick="showTab('loginTab')">Masuk</a></div>
        </div>

        <div id="otpTab" class="hidden">
            <div class="card-title"><h2>Verifikasi OTP</h2></div>
            <div id="otpSentMsg" class="success-popup"></div>
            <form onsubmit="verifyOtp(event)">
                <div class="form-group"><input type="text" id="otpInput" placeholder="Masukkan 4 digit kode" maxlength="4" required></div>
                <button type="submit">VERIFIKASI</button>
            </form>
            <div class="timer">Kirim ulang dalam <span id="countdown">60</span>s</div>
            <button id="resendBtn" onclick="kirimUlangOTP()" disabled>Kirim Ulang OTP</button>
        </div>

        <div id="setPassTab" class="hidden">
            <div class="card-title"><h2>Buat Password</h2></div>
            <form onsubmit="setPassword(event)">
                <div class="form-group"><label>Password Baru</label><input type="password" id="newPass" placeholder="Min. 6 karakter" required></div>
                <div class="form-group"><label>Konfirmasi Password</label><input type="password" id="confirmPass" placeholder="Ulangi password" required></div>
                <button type="submit">SIMPAN & KE HALAMAN LOGIN</button>
            </form>
        </div>
    </div>

    <script>
        let tempUser = {};
        let countdownTimer;
        let currentOtp = "";
        const API = 'https://www.emsifa.com/api-wilayah-indonesia/api';

        (function(){ emailjs.init("YB0pHNoksbrK4fzjg"); })(); 

        window.onload = () => { 
            if(localStorage.getItem('isLogin') === 'true') window.location.href = 'dashboard.html';
            loadProvinsi(); 
        }

        function showTab(tabId) {
            document.querySelectorAll('#loginTab, #registerTab, #otpTab, #setPassTab').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }
        function showPopup(title, msg) {
            popupTitle.textContent = title;
            popupMsg.textContent = msg;
            popup.style.display = 'flex';
        }
        function closePopup() { 
            popup.style.display = 'none';
        }

        async function loadProvinsi() {
            const res = await fetch(`${API}/provinces.json`);
            const prov = await res.json();
            regProvinsi.innerHTML = '<option value="">Pilih Provinsi</option>';
            prov.forEach(p => regProvinsi.innerHTML += `<option value="${p.id}">${p.name}</option>`);
        }
        async function loadKabupaten() {
            const id = regProvinsi.value;
            regKabupaten.innerHTML = '<option>Loading...</option>';
            regKecamatan.innerHTML = '<option>Pilih Kabupaten Dulu</option>';
            const res = await fetch(`${API}/regencies/${id}.json`);
            const kab = await res.json();
            regKabupaten.innerHTML = '<option value="">Pilih Kabupaten</option>';
            kab.forEach(k => regKabupaten.innerHTML += `<option value="${k.id}">${k.name}</option>`);
        }
        async function loadKecamatan() {
            const id = regKabupaten.value;
            regKecamatan.innerHTML = '<option>Loading...</option>';
            const res = await fetch(`${API}/districts/${id}.json`);
            const kec = await res.json();
            regKecamatan.innerHTML = '<option value="">Pilih Kecamatan</option>';
            kec.forEach(k => regKecamatan.innerHTML += `<option>${k.name}</option>`);
        }

        function generateOtp() { return Math.floor(1000 + Math.random() * 9000).toString(); }

        function sendOtpEmail(email, otp) {
            const templateParams = { 
                to_email: email, 
                otp_code: otp, 
                app_name: "BelanjaYuk",
                to_name: tempUser.nama // CUMA INI YANG GUE TAMBAH
            };
            emailjs.send("service_hhoxw7m", "template_t5oquck", templateParams)
                .then(function(response) { console.log('SUCCESS!', response.status, response.text); },
                      function(error) { console.log('FAILED...', error); alert('Gagal kirim OTP. Cek koneksi internet'); });
        }

        function startCountdown() {
            let time = 60; resendBtn.disabled = true; countdown.textContent = time;
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                time--; countdown.textContent = time;
                if(time <= 0) { clearInterval(countdownTimer); resendBtn.disabled = false; }
            }, 1000);
        }
        function kirimUlangOTP() {
            currentOtp = generateOtp();
            sendOtpEmail(tempUser.email, currentOtp);
            otpSentMsg.textContent = `Kode OTP baru telah dikirim ke ${tempUser.email}`;
            otpSentMsg.style.display = 'block';
            setTimeout(() => otpSentMsg.style.display = 'none', 3000);
            showPopup("OTP Terkirim", "Kode Sudah Di Kirim Silahkan Cek Gmail Anda!!!");
            startCountdown();
        }

        function registerStep1(e) {
            e.preventDefault();
            if(!agreeTnC.checked) {alert('Anda harus centang Setuju Syarat & Ketentuan'); return;}
            tempUser = {
                nama: regNama.value, hp: regHp.value, email: regEmail.value, 
                provinsi: regProvinsi.options[regProvinsi.selectedIndex].text, 
                kabupaten: regKabupaten.options[regKabupaten.selectedIndex].text, 
                kecamatan: regKecamatan.value, 
                alamat: regAlamat.value
            };
            localStorage.setItem('tempUser', JSON.stringify(tempUser));
            currentOtp = generateOtp();
            sendOtpEmail(tempUser.email, currentOtp);
            showTab('otpTab');
            otpSentMsg.textContent = `Kode OTP telah dikirim ke ${tempUser.email}`;
            otpSentMsg.style.display = 'block';
            setTimeout(() => otpSentMsg.style.display = 'none', 3000);
            showPopup("OTP Terkirim", "Kode Sudah Di Kirim Silahkan Cek Gmail Anda!!!");
            startCountdown();
        }

        function verifyOtp(e) { 
            e.preventDefault(); 
            if(otpInput.value === currentOtp) {
                clearInterval(countdownTimer);
                showPopup("Verifikasi Berhasil", "Kode OTP benar! Silakan buat password Anda");
                setTimeout(() => { closePopup(); showTab('setPassTab'); }, 1500);
            } else { 
                alert('OTP Salah! Cek kembali kode yang dikirim ke email Anda'); 
            } 
        }

        function setPassword(e) { 
            e.preventDefault(); 
            if(newPass.value !== confirmPass.value) { alert('Password dan Konfirmasi Password tidak sama!'); return; }
            if(newPass.value.length < 6) { alert('Password minimal 6 karakter!'); return; }
            tempUser.password = newPass.value; 
            localStorage.setItem('userBelanjaYuk', JSON.stringify(tempUser)); 
            localStorage.removeItem('tempUser');
            showPopup("Pendaftaran Berhasil", "Akun Anda sudah dibuat. Silakan login");
            setTimeout(() => { closePopup(); showTab('loginTab'); }, 1500);
        }

        function login(e) { 
            e.preventDefault(); 
            errorMsg.style.display = 'none'; 
            const savedUser = JSON.parse(localStorage.getItem('userBelanjaYuk')); 
            if(savedUser && (savedUser.email === loginUser.value || savedUser.hp === loginUser.value) && savedUser.password === loginPass.value) { 
                localStorage.setItem('isLogin', 'true'); 
                showPopup("Login Berhasil", `Selamat datang kembali, ${savedUser.nama}!`);
                setTimeout(() => { closePopup(); window.location.href = 'dashboard.html'; }, 1500);
            } else { 
                errorMsg.style.display = 'block'; 
            } 
        }
    </script>
</body> 
</html>
