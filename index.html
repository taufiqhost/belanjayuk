<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - BelanjaYuk</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #otpBox { display: none; }
        .info { font-size: 12px; color: #666; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- BOX 1: FORM DAFTAR -->
        <div id="registerBox">
            <h2>Daftar Akun Baru</h2>
            <input type="text" id="name" placeholder="Nama Lengkap" required>
            <input type="email" id="email" placeholder="Alamat Email" required>
            <button id="btnKirim" onclick="kirimOTP()">KIRIM KODE OTP</button>
            <p class="info">Kami akan mengirim kode 6 digit ke email kamu</p>
        </div>

        <!-- BOX 2: FORM OTP -->
        <div id="otpBox">
            <h2>Verifikasi Email</h2>
            <input type="text" id="otpInput" placeholder="Masukkan 6 Digit Kode" maxlength="6">
            <button onclick="verifikasiOTP()">VERIFIKASI & DAFTAR</button>
            <button onclick="kembaliKeDaftar()" style="background:#6c757d; margin-top:10px;">Kirim Ulang Kode</button>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        const PUBLIC_KEY  = "YB0pHNoksbrK4fzjg"; 
        const SERVICE_ID  = "service_hhoxw7m";
        const TEMPLATE_ID = "template_t5oquck";
        emailjs.init(PUBLIC_KEY);

        let otpGlobal = "";
        let emailGlobal = "";

        function kirimOTP() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("btnKirim");

            if(name === "" || email === "") {
                alert("Nama dan Email wajib diisi!");
                return;
            }
            if(!email.includes("@")) {
                alert("Format email tidak valid!");
                return;
            }

            otpGlobal = Math.floor(100000 + Math.random() * 900000);
            emailGlobal = email;
            
            btn.disabled = true;
            btn.innerText = "MENGIRIM...";

            const templateParams = {
                to_name: name,
                to_email: email,
                passcode: otpGlobal
            };

            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then(function(response) {
                    // INI UDAH AKU UBAH SESUAI PERMINTAAN KAMU
                    alert("Kode Sudah Di Kirim Ke Email Anda,Silahkan Cek!!!"); 
                    document.getElementById("registerBox").style.display = "none";
                    document.getElementById("otpBox").style.display = "block";
                }, function(error) {
                    alert("Gagal mengirim kode. Error: " + error.text);
                    btn.disabled = false;
                    btn.innerText = "KIRIM KODE OTP";
                });
        }

        function verifikasiOTP() {
            const inputOTP = document.getElementById("otpInput").value.trim();
            
            if(inputOTP == otpGlobal) {
                alert(`Verifikasi Berhasil!\nSelamat datang ${document.getElementById("name").value}`);
            } else {
                alert("Kode yang Anda masukan salah silahkan coba lagi!!!");
                document.getElementById("otpInput").value = "";
                document.getElementById("otpInput").focus();
            }
        }
        
        function kembaliKeDaftar() {
            document.getElementById("otpBox").style.display = "none";
            document.getElementById("registerBox").style.display = "block";
            document.getElementById("btnKirim").disabled = false;
            document.getElementById("btnKirim").innerText = "KIRIM KODE OTP";
        }
    </script>

</body>
  </html>
