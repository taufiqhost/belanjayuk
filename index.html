<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BelanjaYuk - Belanja Online Termurah</title>
    <link rel="icon" href="https://i.imgur.com/WRVAelJ.png">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #0d3b1e);
            color: white;
            margin: 0;
            padding-top: 100px;
        }
        header {
            background: #00ff88;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,255,136,0.4);
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: fit-content;
        }
        header h1 { margin: 0; font-size: 24px; }
        .container { display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 20px; }
        .card-3d {
            background: #111; padding: 30px; border-radius: 15px; width: 420px;
            box-shadow: 0 10px 30px rgba(0,255,136,0.3); transform: perspective(1000px) rotateX(5deg);
        }
        h2 { color: #00ff88; text-align: center; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #ccc; }
        input {
            width: 100%; padding: 10px; margin-top: 5px; border: 2px solid #333; border-radius: 8px;
            background: #222; color: white; outline: none; box-sizing: border-box;
        }
        input:focus { border-color: #00ff88; }
        button {
            width: 100%; padding: 12px; margin-top: 20px; background: linear-gradient(90deg, #00ff88, #00cc66);
            border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer;
        }
        button:hover { transform: translateY(-2px); }
        .hidden { display: none; }
        .version-badge {
            position: fixed; bottom: 15px; left: 15px; background: rgba(0,255,136,0.15);
            border: 1px solid #00ff88; color: #00ff88; padding: 5px 12px; border-radius: 20px; font-size: 12px;
        }
        .dashboard { text-align: center; }
        .dashboard h2 { font-size: 28px; }
        .security-note { text-align: center; font-size: 12px; color: #777; margin-top: 20px; }
    </style>
</head>
<body>
    <header>🛒 <h1>BelanjaYuk</h1></header>

    <main class="container">
        <!-- CUMA ADA LOGIN -->
        <div class="card-3d" id="loginBox">
            <h2>Masuk Akun</h2>
            <form onsubmit="login(event)">
                <label>No HP / Gmail</label>
                <input type="text" id="loginUser" placeholder="08xxx / email@gmail.com" required>

                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Masukkan password" required>

                <button type="submit">Login</button>
            </form>
            <div class="security-note">🔒 Data anda dienkripsi & aman</div>
        </div>

        <!-- DASHBOARD -->
        <div class="card-3d hidden" id="dashboardBox">
            <div class="dashboard">
                <h2>Selamat Datang, <span id="userNama"></span> ! 🎉</h2>
                <p>Akun kamu sudah aktif di BelanjaYuk</p>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </main>

    <div class="version-badge">v1.2.1</div>

    <script>
        // CEK APAKAH UDAH LOGIN SEBELUMNYA
        window.onload = function() {
            const savedUser = JSON.parse(localStorage.getItem('userBelanjaYuk'));
            if(savedUser) {
                document.getElementById('userNama').innerText = savedUser.nama;
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboardBox').classList.remove('hidden');
            }
        }

        function login(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const savedUser = JSON.parse(localStorage.getItem('userBelanjaYuk'));
            
            if(savedUser && (savedUser.email === user || savedUser.hp === user) && savedUser.password === pass) {
                document.getElementById('userNama').innerText = savedUser.nama;
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('dashboardBox').classList.remove('hidden');
            } else {
                alert('Email/No HP atau Password salah');
            }
        }

        function logout() {
            localStorage.removeItem('userBelanjaYuk');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('dashboardBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
        }
    </script>
</body>
</html>
